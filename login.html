
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ScamSafe</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .login-box {
      max-width: 420px;
      margin: 55px auto;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px #33206020;
    }

    .login-box h1 {
      text-align: center;
      color: #7048c6;
    }

    .login-box p {
      text-align: center;
      color: #667085;
    }

    .role-label {
      display: block;
      margin-top: 25px;
      margin-bottom: 8px;
      font-weight: bold;
      color: #30384b;
    }

    .role-select-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .role-icon {
      position: absolute;
      left: 13px;
      font-size: 20px;
      pointer-events: none;
    }

    #loginRole {
      width: 100%;
      padding: 13px 40px 13px 45px;
      border: 1px solid #ddd6f2;
      border-radius: 9px;
      background: #faf8ff;
      color: #30384b;
      font-size: 15px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      box-sizing: border-box;
    }

    #loginRole:focus {
      outline: 2px solid #7048c6;
      border-color: #7048c6;
    }

    .dropdown-arrow {
      position: absolute;
      right: 14px;
      color: #7048c6;
      pointer-events: none;
      font-size: 15px;
    }

    .login-box label:not(.role-label) {
      display: block;
      margin-top: 17px;
      font-weight: bold;
    }

    .login-box input[type="email"],
    .login-box input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ddd;
      border-radius: 9px;
      box-sizing: border-box;
    }

    .login-box button[type="submit"] {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #7048c6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .login-box button[type="submit"]:hover {
      background: #5633a3;
    }

    .login-box button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      overflow-wrap: anywhere;
    }

    .login-box a {
      color: #7048c6;
    }

    @media (max-width: 500px) {
      .login-box {
        margin: 25px 15px;
        padding: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="login-box">
    <h1>🛡️ Welcome Back!</h1>
    <p>Log in to continue your ScamSafe journey.</p>

    <form id="loginForm">

      <label for="loginRole" class="role-label">
        Select Account Role
      </label>

      <div class="role-select-wrapper">
        <span class="role-icon" id="roleIcon">👤</span>

        <select id="loginRole" required>
          <option value="user">Registered User</option>
          <option value="admin">Administrator</option>
        </select>

        <span class="dropdown-arrow">▼</span>
      </div>

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        required
        autocomplete="username"
        placeholder="Enter your email"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
        placeholder="Enter your password"
      >

      <button type="submit" id="loginButton">
        Login ✨
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p id="registerPrompt">
      Don't have an account?
      <a href="register.html">Register here</a>
    </p>

    <p><a href="index.html">← Back to Home</a></p>
  </main>

  <script>
    const roleSelect = document.getElementById("loginRole");
    const roleIcon = document.getElementById("roleIcon");
    const loginButton = document.getElementById("loginButton");
    const registerPrompt = document.getElementById("registerPrompt");
    const message = document.getElementById("message");

    function updateRoleDisplay() {
      const role = roleSelect.value;

      roleIcon.textContent = role === "admin" ? "🛡️" : "👤";

      loginButton.textContent =
        role === "admin"
          ? "Login as Administrator 🛡️"
          : "Login as Registered User ✨";

      registerPrompt.style.display =
        role === "admin" ? "none" : "block";

      message.textContent = "";
    }

    roleSelect.addEventListener("change", updateRoleDisplay);

    updateRoleDisplay();
  </script>

  <script type="module" src="login.js"></script>
</body>
</html>
